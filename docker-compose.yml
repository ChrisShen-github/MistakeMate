services:
  mistakemate:
    container_name: mistakemate
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgresql+psycopg://mistakemate:${POSTGRES_PASSWORD:-mistakemate_local_only}@postgresql:5432/mistakemate
      STORAGE_ROOT: /app/storage
    volumes:
      - ./storage:/app/storage
    depends_on:
      postgresql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; assert urlopen('http://127.0.0.1:8080/api/health').status == 200"]
      interval: 10s
      timeout: 3s
      retries: 6
    restart: unless-stopped

  postgresql:
    container_name: postgresql
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mistakemate
      POSTGRES_USER: mistakemate
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mistakemate_local_only}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mistakemate -d mistakemate"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

volumes:
  postgres-data:
