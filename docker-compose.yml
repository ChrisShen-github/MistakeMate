services:
  mistakemate:
    image: akwangdao/mistakemate:latest
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgresql+psycopg://mistakemate:${POSTGRES_PASSWORD:-mistakemate_local_only}@postgresql:5432/mistakemate
      STORAGE_ROOT: /app/storage
      PADDLE_PDX_MODEL_SOURCE: BOS
    volumes:
      - ./data:/app/storage
      - ./models:/root/.paddlex
    depends_on:
      - postgresql
    restart: unless-stopped

  postgresql:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mistakemate
      POSTGRES_USER: mistakemate
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mistakemate_local_only}
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
